<div>
    <!-- <app-innings-tab (inningsChange)="onInningsChange($event)"/> -->
    <dx-data-grid [dataSource]="FieldingStats" [allowColumnReordering]="false" keyExpr="SrNo" [showColumnLines]="true" [sorting]="{mode:'none'}"
        [showRowLines]="true" [showBorders]="true" [elementAttr]="{ class: 'custom-data-grid' }"
        [allowColumnReordering]="true" [allowColumnResizing]="true" [columnAutoWidth]="isMobile" [width]="'100%'"
        (onCellClick)="onCellClick($event)">
        <dxi-column dataField="SrNo" caption="Sr No" alignment="left" width="60px"></dxi-column>
        <dxi-column dataField="Name" caption="Name" alignment="left" cssClass="video-class"></dxi-column>
        <dxi-column dataField="RunsSaved" caption="Runs Saved" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="RunsMissed" caption="Runs Missed" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="NetRunsSaved" caption="Net Runs Saved" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="CatchesTaken" caption="Catches Taken" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="CatchesDropped" caption="Catches Dropped" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="CatchEfficiency" caption="Catch Efficiency" alignment="right" cssClass="video-class" cellTemplate="efficiencyTemplate"></dxi-column>
        <dxi-column dataField="RunoutSuccess" caption="Runout Success" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="RunoutMissed" caption="Runout Missed" alignment="right" cssClass="video-class"></dxi-column>
        <dxi-column dataField="RunoutEfficiency" caption="Runout Efficiency" alignment="right" cssClass="video-class" cellTemplate="efficiencyTemplate"></dxi-column>
        <dxi-column dataField="Touches" caption="Touches" alignment="right" cssClass="video-class"></dxi-column>

        <div *dxTemplate="let d of 'efficiencyTemplate'">
          {{ d.value !== null && d.value !== undefined ? (d.value | number:'1.0-1') : '' }}
        </div>
      </dx-data-grid>
</div>

<app-video [selctedInnings]="this.selctedInnings()" [matchInfo]="matchDetails()" />
