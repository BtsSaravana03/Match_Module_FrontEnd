<div class="container mt-3">
    <app-innings-tab (inningsChange)="onInningsChange($event)"/>

    <dx-data-grid [dataSource]="FieldingStats" [allowColumnReordering]="false" keyExpr="SrNo" [showColumnLines]="true" [sorting]="{mode:'none'}"

        [allowColumnReordering]="true" [allowColumnResizing]="true" [columnAutoWidth]="true">
      </dx-data-grid>
</div>
