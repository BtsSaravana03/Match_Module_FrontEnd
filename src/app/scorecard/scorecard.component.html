<div class="container">
  <app-summary-header [summary]="summary" [matchDetails]="matchDetails()" [selctedInnings]="selctedInnings" [isMobile]="isMobile" [currentInnings]="currentInnings"/>
  <app-innings-tab (inningsChange)="onInningsChange($event)"/>
  @if(ballArray().length>0){
    <app-batting-card [ballArray]="ballArray()" [selctedInnings]="selctedInnings" [summary]="summary" [isMobile]="isMobile"/>
    <br />
    <app-fall-of-wickets [ballArray]="ballArray()" [selctedInnings]="selctedInnings" />
    <br />
    <app-bowling-card [ballArray]="ballArray()" [selctedInnings]="selctedInnings" />
  }
  <app-video [selctedInnings]="selctedInnings" [matchInfo]="matchDetails()"/>
  <br/>
</div>
