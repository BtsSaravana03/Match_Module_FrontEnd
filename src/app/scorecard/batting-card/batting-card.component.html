<dx-data-grid [dataSource]="battingCard" [allowColumnReordering]="false" keyExpr="strikerID" [showColumnLines]="true"
  [sorting]="{mode:'none'}" [showRowLines]="true" [showBorders]="true" [elementAttr]="{ class: 'custom-data-grid' }"
  [allowColumnReordering]="true" [allowColumnResizing]="true" [columnAutoWidth]="true" (onCellClick)="onCellClick($event)">
  <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
  <dxi-column dataField="strikerName" caption="Batsman" [width]="230" [fixed]="true" alignment="center"></dxi-column>
  <dxi-column dataField="dismissalSts" caption="" alignment="left" cssClass="video-class"></dxi-column>
  <dxi-column dataField="runs" caption="R" alignment="center" title="Runs" cssClass="video-class"></dxi-column>
  <dxi-column dataField="balls" caption="B" alignment="center" title="Balls" cssClass="video-class"></dxi-column>
  <dxi-column dataField="strikeRate" caption="SR" alignment="center" title="Strike Rate"></dxi-column>
  <dxi-column dataField="dot" caption="DB" alignment="center" title="Dot Balls" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_1s" caption="1s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_2s" caption="2s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_3s" caption="3s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_4s" caption="4s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_6s" caption="6s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="dotPer" caption="Dot%" alignment="center"></dxi-column>
  <dxi-column dataField="bdryPer" caption="Bdry%" alignment="center" title="Boundary%"></dxi-column>
  <!-- <dxo-summary>
    <dxi-total-item
      column="strikerName"
      [customizeText]="setExtras()"
    >
    </dxi-total-item>
  </dxo-summary> -->
</dx-data-grid>
