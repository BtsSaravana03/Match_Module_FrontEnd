
<dx-data-grid [dataSource]="bowlingCard" [allowColumnReordering]="false" keyExpr="bowlerId" [showColumnLines]="true" [sorting]="{mode:'none'}"
  [showRowLines]="true" [showBorders]="true" [elementAttr]="{ class: 'custom-data-grid' }"
  [allowColumnReordering]="true" [allowColumnResizing]="true" [columnAutoWidth]="true" (onCellClick)="onCellClick($event)">
  <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
  <dxi-column dataField="bowlerName" caption="Bowler" [width]="230" [fixed]="true" alignment="center"></dxi-column>
  <dxi-column dataField="overs" caption="O" alignment="center" title="Overs" cssClass="video-class"></dxi-column>
  <dxi-column dataField="maiden" caption="M" alignment="center" title="Maiden" cssClass="video-class"></dxi-column>
  <dxi-column dataField="runs" caption="R" alignment="center" title="Runs" cssClass="video-class"></dxi-column>
  <dxi-column dataField="wkt" caption="W" alignment="center" title="Wickets" cssClass="video-class"></dxi-column>
  <dxi-column dataField="wide" caption="WD" alignment="center" title="Wide" cssClass="video-class"></dxi-column>
  <dxi-column dataField="nb" caption="NB" alignment="center" title="NoBall" cssClass="video-class"></dxi-column>
  <dxi-column dataField="dot" caption="DB" alignment="center" title="Dots" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_1s" caption="1s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_2s" caption="2s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_3s" caption="3s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_4s" caption="4s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="_6s" caption="6s" alignment="center" cssClass="video-class"></dxi-column>
  <dxi-column dataField="byes" caption="Bye's" alignment="center" title="Byes" cssClass="video-class"></dxi-column>
  <dxi-column dataField="legByes" caption="LB" alignment="center" title="Leg Byes" cssClass="video-class"></dxi-column>
  <dxi-column dataField="dotPer" caption="Dot%" alignment="center"></dxi-column>
  <dxi-column dataField="bdryPer" caption="Bdry%" alignment="center" title="Boundary%"></dxi-column>
</dx-data-grid>
