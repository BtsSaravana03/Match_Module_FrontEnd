<app-card>
    <div class="mb-3 pt-3" *ngIf="this.matchDetails() && this.matchDetails().inningsData.length>0">
        <app-tabs [dataSource]="this.matchDetails().inningsData" displayExpression="BattingClubPrefix"
          keyExpression="InningsID" [visibility]="true" [TinyTabSize]="true"
          (onTabSelectionChange)="onInningsChange($event)"></app-tabs>
      </div>
      <dx-data-grid [dataSource]="SpellWiseData" [allowColumnReordering]="false" keyExpr="PlayerName" [showColumnLines]="true" [sorting]="{mode:'none'}"
      [showRowLines]="true" [showBorders]="true" [elementAttr]="{ class: 'custom-data-grid' }"
      [allowColumnReordering]="true" [allowColumnResizing]="true" [columnAutoWidth]="isMobile" [width]="'100%'">
      <dxo-scrolling mode="infinite"></dxo-scrolling>
    </dx-data-grid>
</app-card>
