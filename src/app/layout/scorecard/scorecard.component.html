<div class="p-3">
    <div class="sticky-tab">
        <dx-tabs [width]="'fit-content'" [rtlEnabled]="false" [scrollByContent]="true" [noDataText]="''"
        [focusStateEnabled]="false" [className]="'innings-template'" [showNavButtons]="true" [selectedItem]="TabSelected"
        [dataSource]="['Scorecard','Partnership','Worm','Manhattan','Match info']" [orientation]="'horizontal'"
        (onSelectionChanged)="onTabChange($event)" [stylingMode]="'secondary'">
      </dx-tabs>
    </div>
  <app-card>
    <div id="Scorecard" class="mt-3">
      <app-batting-card [ballArray]="ballArray()" [selctedInnings]="selctedInnings" [summary]="summary" />
      <br />
      <app-fall-of-wickets [ballArray]="ballArray()" [selctedInnings]="selctedInnings" />
      <br />
      <app-bowling-card [ballArray]="ballArray()" [selctedInnings]="selctedInnings" />
    </div>
  </app-card>
  <app-card>
    <div id="Partnership" class="mt-3">
      <app-partnership [selctedInnings]="selctedInnings"></app-partnership>
    </div>
  </app-card>
  <app-card>
    <div id="Worm" class="mt-3">
      <app-worm [selctedInnings]="selctedInnings"></app-worm>
    </div>
  </app-card>
  <app-card>
    <div id="Manhattan" class="mt-3">
      <app-manhatten [selctedInnings]="selctedInnings"></app-manhatten>
    </div>
  </app-card>
</div>
<app-video [selctedInnings]="selctedInnings" [matchInfo]="matchDetails()" />
