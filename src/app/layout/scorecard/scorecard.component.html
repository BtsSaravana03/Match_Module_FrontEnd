<div class="p-3">
  <div class="sticky-tab">
    <dx-tabs [width]="this.isMobile()?'auto':'fit-content'" [rtlEnabled]="false" [scrollByContent]="true" [noDataText]="''"
      [focusStateEnabled]="false" [className]="'innings-template'" [showNavButtons]="true" [selectedItem]="TabSelected"
      [dataSource]="Tabs" [orientation]="'horizontal'"
      (onSelectionChanged)="onTabChange($event)" [stylingMode]="'secondary'">
    </dx-tabs>
  </div>
  <div class="mt-2" *ngIf="this.matchDetails() && this.matchDetails().inningsData.length>0">
    <app-tabs [dataSource]="this.matchDetails().inningsData" displayExpression="BattingClubPrefix" keyExpression="InningsID" [visibility]="true" [TinyTabSize]="true" (onTabSelectionChange)="onInningsChange($event)"></app-tabs>
  </div>
  <app-card [ApplyDefaultStyle]="true">
    <div id="Scorecard" #Scorecard>
      <ng-container>
        <app-batting-card [ballArray]="ballArray()" [selctedInnings]="selctedInnings" [summary]="summary" />
        <br />
        <app-fall-of-wickets [ballArray]="ballArray()" [selctedInnings]="selctedInnings" />
        <br />
        <app-bowling-card [ballArray]="ballArray()" [selctedInnings]="selctedInnings" />
      </ng-container>
    </div>
  </app-card>
  <br />
  <app-card [ApplyDefaultStyle]="true">
    <div id="Partnership" #Partnership>
      <ng-container>
        <app-partnership [matchDetails]="this.matchDetails()"></app-partnership>
      </ng-container>
    </div>
  </app-card>
  <br />
  <app-card [ApplyDefaultStyle]="true">
    <div id="Worm" #Worm>
      <ng-container>
        <app-worm [selctedInnings]="selctedInnings"></app-worm>
      </ng-container>
    </div>
  </app-card>
  <br />
  <app-card [ApplyDefaultStyle]="true">
    <div id="Manhattan" #Manhattan>
      <ng-container>
        <app-manhatten [selctedInnings]="selctedInnings"></app-manhatten>
      </ng-container>
    </div>
  </app-card>
</div>
<app-video [selctedInnings]="selctedInnings" [matchInfo]="matchDetails()" />
