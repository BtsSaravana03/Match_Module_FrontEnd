<div>
    <app-summary-header [ballArray]="ballArray()" [currentInnings]="currentInnings" [selctedInnings]="selctedInnings" [summary]="summary" [matchDetails]="matchDetails()"/>
</div>
<div class="px-4 py-2">
    <div class="sticky-tab">
        <dx-tabs [width]="this.isMobile?'auto':'fit-content'" [rtlEnabled]="false" [scrollByContent]="true"
          [noDataText]="''" [focusStateEnabled]="false" [className]="'innings-template'" [showNavButtons]="true"
          [selectedItem]="TabSelected" [dataSource]="Tabs" [orientation]="'horizontal'"
          (onSelectionChanged)="onTabChange($event)" [stylingMode]="'secondary'">
        </dx-tabs>
      </div>
    @if(matchDetails().inningsData){
        <div class="mx-2 mt-3 mb-3" *ngIf="this.matchDetails().inningsData.length>0 && TabSelected !== 'OverComparison'">
            <app-tabs [dataSource]="this.matchDetails().inningsData" displayExpression="BattingClubPrefix" keyExpression="InningsID" [visibility]="true" [TinyTabSize]="true" (onTabSelectionChange)="onInningsChange($event)"></app-tabs>
          </div>
        <app-card>
            @if(ballArray().length >0){
                @if(TabSelected === 'OverByOver'){
                    <app-over-by-over [ballArray]="ballArray()" [selctedInnings]="selctedInnings"></app-over-by-over>
                }
                @else if(TabSelected === 'PhaseWise'){
                    <app-phase-wise [selctedInnings]="selctedInnings" [ballArray]="ballArray()" [matchDetails]="this.matchDetails()"></app-phase-wise>
                }
                @else if(TabSelected === 'OverComparison'){
                    <div class="mt-3">
                        <app-over-comparison [ballArray]="ballArray()" [matchDetails]="this.matchDetails()"></app-over-comparison>
                    </div>

                }
            }
        </app-card>
    }

</div>
