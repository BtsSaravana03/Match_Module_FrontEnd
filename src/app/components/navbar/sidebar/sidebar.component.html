<section id="sidebar" [ngClass]="{'d-none': !visible()}" [@slideInOut]="{ value: visible() ? 'in' : 'out', params: { sidebarWidth: sidebarWidth }}">
  <div class="close-container">
    <h5>Menu</h5>
    <i class="fa-regular fa-xmark fa-lg" (click)="visible.set(false)"></i>
  </div>
  <ul class="nav-links">
    @for (item of navigation; track $index) {
        <li><a [routerLink]="[item.path]" routerLinkActive="active"  (click)="setHeader(item.name)"><i class="{{item.icon}} me-2"></i> {{item.name}}</a></li>
    }
   
  </ul>
</section>
