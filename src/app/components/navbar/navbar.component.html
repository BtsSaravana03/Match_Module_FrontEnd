<nav class="navbar"  [ngClass]="{'d-none': !visibility()}">
    <div class="d-flex align-items-center gap-4 justify-content-between w-100">
    <div class="logo"><img src="../../../../../images/cricket_21_logo.png" class="logo_1" alt="LOGO"></div>
    <div class="search-bar">
        <button class="menu-btn" (click)="sidebarVisible=true"><i class="fa-solid fa-bars"></i></button>
        <input type="text" placeholder="Search" />
        <button class="search-btn"><i class="fa-solid fa-magnifying-glass search-btn"></i></button>
    </div>
</div>
</nav>

<app-sidebar [(visible)]="sidebarVisible" (header)="setHeader($event)"/>
<div class="overlay" [ngClass]="{'d-none': !sidebarVisible}"></div>
<app-filter target="#filter" [mobile_view]="isMobile" />
