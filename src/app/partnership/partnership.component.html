<div class="container mt-3">
  <app-innings-tab (inningsChange)="onInningsChange($event)" />
  <dx-data-grid [dataSource]="Partnership()" [allowColumnReordering]="false" keyExpr="Wicket" [showColumnLines]="true"
    [sorting]="{mode:'none'}" [showRowLines]="true" [showBorders]="true" [elementAttr]="{ class: 'custom-data-grid' }"
    [allowColumnReordering]="true" [allowColumnResizing]="true" [columnAutoWidth]="true">
    <!-- <dxo-column-fixing [enabled]="true"></dxo-column-fixing> -->
    <dxi-column dataField="Player_1_1s" caption="6's" alignment="left"></dxi-column>
    <dxi-column dataField="Player_1_2s" caption="4's" alignment="left"></dxi-column>
    <dxi-column dataField="Player_1_3s" caption="3's" alignment="left"></dxi-column>
    <dxi-column dataField="Player_1_4s" caption="2's" alignment="left"></dxi-column>
    <dxi-column dataField="Player_1_6s" caption="1's" alignment="left"></dxi-column>
    <dxi-column dataField="Player_1_0s" caption="0's" alignment="left"></dxi-column>
    <dxi-column dataField="Player_1_Name" caption="Player Name" alignment="left"></dxi-column>
    <dxi-column dataField="Wicket" caption="Wkt" alignment="center" cssClass="partnership-highlight"></dxi-column>
    <dxi-column dataField="Runs" caption="Partnership" alignment="center" cssClass="partnership-highlight"></dxi-column>
    <dxi-column dataField="Player_2_Name" caption="Player Name" alignment="right"></dxi-column>
    <dxi-column dataField="Player_2_0s" caption="0's" alignment="right"></dxi-column>
    <dxi-column dataField="Player_2_1s" caption="1's" alignment="right"></dxi-column>
    <dxi-column dataField="Player_2_2s" caption="2's" alignment="right"></dxi-column>
    <dxi-column dataField="Player_2_3s" caption="3's" alignment="right"></dxi-column>
    <dxi-column dataField="Player_2_4s" caption="4's" alignment="right"></dxi-column>
    <dxi-column dataField="Player_2_6s" caption="6's" alignment="right"></dxi-column>
    <dxi-column cellTemplate="cellTemplate" alignment="center" width="50px"></dxi-column>
    <div *dxTemplate="let data of 'cellTemplate'">
      <i class="fa-solid fa-circle-play fa-lg " style="color: #74C0FC;" (click)="onCellClick(data.data)"></i>
    </div>
  </dx-data-grid>

</div>
<app-video [selctedInnings]="selctedInnings" [matchInfo]="matchDetails()" />
