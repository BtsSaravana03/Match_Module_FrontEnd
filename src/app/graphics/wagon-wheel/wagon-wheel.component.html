<div>

                  fill: #006838;
                }

                .ww-cls-5 {
                  fill: none;
                  stroke-miterlimit: 10;

                .ww-cls-3,
                .ww-cls-4 {
                  stroke: #fff;
                }

                .ww-cls-2 {
                  stroke-width: 0.34px;

                  stroke-width: 0.34px;
                }

                .ww-cls-4 {

                }

                  stroke-width: 1.81px;
                  stroke-dasharray: 14.5 14.5;
                }

              </style>
            </defs>
            <g id="Layer_2" data-name="Layer 2">

                </svg>
              </g>
            </g>

          </svg>
        </g>
        <g [attr.transform]="'translate('+ww_Width+', 0)'">

              <style>
                .cls-1,
                .cls-3,
                .cls-4,
                .cls-5 {
                  stroke: #fff;
                  stroke-miterlimit: 10;
                  stroke-width: 0.5px;
                }

                .cls-2 {

                  fill: #231f20;
                  font-family: Poppins, Arial;
                }

              </style>
            </defs>>
