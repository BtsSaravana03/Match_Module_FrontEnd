<div>
    <dx-chart id="worm" [dataSource]="worm" *ngIf="worm.length > 0" >
      <dxi-series
        [valueField]="'Runs'"
        [argumentField]="'Over'"
        [name]="clubName"
        type="spline"
        color="#184bd3">
      </dxi-series>

      <dxo-argument-axis
        [tickInterval]="1"
        [valueMarginsEnabled]="false"
        [grid]="{ visible: false }"
        [label]="{ format: { type: 'decimal' }, font: {
            family: 'Readex Pro, sans-serif',
            size: 14,
            color: '#333333'
        }}"
        [title]="{ text: 'Overs' }">
      </dxo-argument-axis>

      <dxi-value-axis [grid]="{ visible: false }" [title]="{ text: 'Runs' }" [label]="{font: {
        family: 'Readex Pro, sans-serif',
        size: 14,
        color: '#333333'
    }}"></dxi-value-axis>

      <dxo-legend [visible]="true" horizontalAlignment="center"></dxo-legend>
      <dxo-tooltip
  [enabled]="true"
  [customizeTooltip]="customizeWormTooltip"
  [shared]="false">
</dxo-tooltip>
    </dx-chart>
  </div>
