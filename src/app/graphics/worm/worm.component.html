<div>
    <dx-chart id="worm" [dataSource]="worm" *ngIf="worm.length > 0" >
      <dxi-series
        [valueField]="'Runs'"
        [argumentField]="'Over'"
        [name]="clubName"
        type="spline"
        color="#184bd3"

        [label]="{
            visible: true,
            position: 'outside',
            customizeText: customizeLabelText,
            font: {
                family: 'Readex Pro, sans-serif',
                size: 14,
                color: '#184bd3'
            },
            backgroundColor: '#fff',
            border: {
                visible: true,
                width: 1,
                color: '#184bd3',
                cornerRadius: 10
            }
        }">
      </dxi-series>

      <dxo-argument-axis
        [tickInterval]="1"
        [valueMarginsEnabled]="false"
        [grid]="{ visible: false }"
        [label]="{ format: { type: 'decimal' }, font: {
            family: 'Readex Pro, sans-serif',
            size: 14,
            color: '#333333'
        }}"
        [title]="{ text: 'Overs' }">
      </dxo-argument-axis>

      <dxi-value-axis [grid]="{ visible: false }" [title]="{ text: 'Runs' }" [label]="{font: {
        family: 'Readex Pro, sans-serif',
        size: 14,
        color: '#333333'
    }}"></dxi-value-axis>

      <dxo-legend [visible]="true" horizontalAlignment="center"></dxo-legend>
    </dx-chart>
  </div>
