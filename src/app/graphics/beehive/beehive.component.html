          <style>
            .bh-cls-1 {
              fill: #58595b;
            }
            .bh-cls-2,
            .bh-cls-3 {
              fill: none;
              stroke: #6d6e71;
              stroke-miterlimit: 10;
            }

            .bh-cls-2 {
              stroke-width: 2px;
            }

            .bh-cls-3 {
              stroke-dasharray: 3;

        <rect class="bh-cls-1" x="227.09" y="246.77" width="4.77" height="102.47" rx="0.93" />

        <line class="bh-cls-3" x1="29.13" y1="-0.04" x2="29.13" y2="355.36" />
        <line class="bh-cls-3" x1="161.38" y1="-0.04" x2="161.38" y2="355.36" />

        <svg id="beehiveContainer" xmlns="http://www.w3.org/2000/svg" [attr.width]="bh_Width" [attr.height]="bh_Height"
          viewBox="-246 -350 493 355">

        </svg>
      </svg>
    </g>
    <g [attr.transform]="'translate('+bh_Width+', 0)'">
      <svg xmlns="http://www.w3.org/2000/svg" [attr.width]="25" [attr.height]="bh_Height"
          [attr.viewBox]="'0 0 ' + 25 + ' ' + bh_Height">
          <defs>
            <style>
              .cls-1,.cls-3,.cls-4,.cls-5{stroke:#fff;stroke-miterlimit:10;stroke-width:0.5px;}

          </defs>>
          <g id="Legends" data-name="Legends" [attr.transform]="'translate(0 ,'+ (bh_Height - 105)+')'">
