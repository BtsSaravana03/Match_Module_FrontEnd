<dx-popover [target]="target()" showEvent="click" className="mt-3" [width]="mobile_view()?'95%':400" [shading]="true"
  [position]="{at:'bottom'}" [showTitle]="false" shadingColor="rgba(0, 0, 0, 0.5)" #filterPopover
  [animation]="slideAnimation" [enableBodyScroll]="false">
  <div *dxTemplate="let data of 'content'">
    <div id="filter-wrap">
      <dx-tabs #withIcon [selectedIndex]="selectedTabIndex" [scrollByContent]="true" [showNavButtons]="true"
        [dataSource]="tabsWithIcon" [orientation]="'horizontal'" (onItemClick)="onTabSelectionChange($event)">
      </dx-tabs>
      <ng-template [ngIf]="selectedTabIndex === 0">
       <div class="mt-3">
        <h6 class="text-secondary">Bowling Types</h6>
        <div class="check-group mt-2">
          @for (m of BowlingTypes; track $index) {
          <dx-check-box [value]="appliedFilters.BowlingType.includes(m.Id)" [text]="m.Prefix"
            (onValueChanged)="onCheckboxChange('BowlingType',m.Id,$event.value)"></dx-check-box>
          }
        </div>
        <hr />
        <h6 class="text-secondary">Batting Types</h6>
        <div class="check-group mt-2">
          <dx-check-box [value]="appliedFilters.BattingType.includes(1)" text="RHB"
            (onValueChanged)="onCheckboxChange('BattingType',1,$event.value)"></dx-check-box>
          <dx-check-box [value]="appliedFilters.BattingType.includes(2)" text="LHB"
            (onValueChanged)="onCheckboxChange('BattingType',2,$event.value)"></dx-check-box>
        </div>
       </div>
        

      </ng-template>
      <ng-template [ngIf]="selectedTabIndex === 1">
        <div class="mt-3">
        <h6 class="text-secondary">Batsmans</h6>
        <div class="check-group-player mt-2">
          @for (m of Batsman; track $index) {
            @if(m.Name){
              <dx-check-box [value]="appliedFilters.BowlingType.includes(m.Id)" [text]="m.Name"
              (onValueChanged)="onCheckboxChange('Batsman',m.Id,$event.value)"></dx-check-box>
            }
         
          }
        </div>
      </div>
      </ng-template>
      <ng-template [ngIf]="selectedTabIndex === 2">
        <div class="mt-3">
        <h6 class="text-secondary">Bowlers</h6>
        <div class="check-group-player mt-2">
          @for (m of Bowler; track $index) {
            @if(m.Name){
              <dx-check-box [value]="appliedFilters.BowlingType.includes(m.Id)" ngis [text]="m.Name"
              (onValueChanged)="onCheckboxChange('Bowlers',m.Id,$event.value)"></dx-check-box>
            }
            }
        </div>
      </div>
      </ng-template>
    </div>
    <div class="mt-4" style="text-align: end;">
      <dx-button text="Apply Filter" stylingMode="contained" (onClick)="apply()" type="success"></dx-button>
    </div>
  </div>
</dx-popover>
